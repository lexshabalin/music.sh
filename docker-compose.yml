# Proxmox-friendly: runtime CPU/RAM caps, gentle scan pacing, worker concurrency 1 by default.
# `docker compose build` still stresses the HOST (not capped by cpus/mem_limit); deploy script uses BuildKit parallelism + nice/ionice.
#
# MUSIC_HOST_DIR in `.env`: host path to the library. Large libraries on a single HDD: keep VM/Postgres disks on SSD if possible —
# scanning + Postgres on one spindle pushes iowait through the roof (looks like «Proxmox died», often nothing logged).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=4MB
    environment:
      POSTGRES_USER: musicsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicsh}
      POSTGRES_DB: musicsh
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicsh -d musicsh"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    cpus: "0.75"
    mem_limit: 512m

  musicsh:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MUSICSH_PORT:-8180}:8080"
    environment:
      DATABASE_URL: postgres://musicsh:${POSTGRES_PASSWORD:-musicsh}@db:5432/musicsh?sslmode=disable
      MUSIC_DIR: /music
      DATA_DIR: /data
      HTTP_ADDR: "0.0.0.0:8080"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      # Stronger pacing defaults for rotational drives; tune per host (raise EVERY / lower MS to go faster on SSD).
      LIBRARY_SCAN_YIELD_EVERY: ${LIBRARY_SCAN_YIELD_EVERY:-25}
      LIBRARY_SCAN_YIELD_MS: ${LIBRARY_SCAN_YIELD_MS:-35}
      SCAN_PROGRESS_INTERVAL_MS: ${SCAN_PROGRESS_INTERVAL_MS:-500}
      SCAN_PROGRESS_MIN_FILES: ${SCAN_PROGRESS_MIN_FILES:-25}
      # Caps simultaneous ffprobe/ffmpeg/fpcalc (overlapping scan + background jobs).
      MUSICSH_MEDIA_PROC_SLOTS: ${MUSICSH_MEDIA_PROC_SLOTS:-3}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
    cpus: '1'
    mem_limit: 1536m
    pids_limit: 128
    volumes:
      # Writable mount required if you use imprint — use a compose override and drop :ro.
      - ${MUSIC_HOST_DIR}:/music:ro
      - musicsh_data:/data

volumes:
  pgdata:
  musicsh_data:
