services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: musicsh
      POSTGRES_PASSWORD: musicsh
      POSTGRES_DB: musicsh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicsh -d musicsh"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://musicsh:musicsh@db:5432/musicsh?sslmode=disable
      JWT_SECRET: change-me-in-production-please-32ch
      MUSIC_DIR: /music
      DATA_DIR: /data
      SCAN_ON_START: "0"
    volumes:
      - type: bind
        source: ${MUSIC_HOST_DIR:-./music}
        target: /music
        read_only: true
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
