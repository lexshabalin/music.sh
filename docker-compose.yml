# Proxmox / single-node friendly defaults: capped CPU/RAM for the stack, no scan-on-start,
# paced library scan + fewer concurrent worker jobs (see WORKER_CONCURRENCY).
#
# Needs MUSIC_HOST_DIR (host path to library). JWT is auto-generated and stored in the data volume ($DATA_DIR/.jwt_secret).
# Optional .env: POSTGRES_PASSWORD, MUSIC_HOST_DIR, …
#
# Optional: POSTGRES_PASSWORD, MUSICSH_PORT, WORKER_CONCURRENCY, LIBRARY_SCAN_YIELD_*,
#           ACOUSTID_KEY, SCAN_ON_START=1 via override file — avoid SCAN_ON_START on every redeploy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicsh}
      POSTGRES_DB: musicsh
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicsh -d musicsh"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    cpus: '1'
    mem_limit: 512m

  musicsh:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MUSICSH_PORT:-8180}:8080"
    environment:
      DATABASE_URL: postgres://musicsh:${POSTGRES_PASSWORD:-musicsh}@db:5432/musicsh?sslmode=disable
      MUSIC_DIR: /music
      DATA_DIR: /data
      HTTP_ADDR: "0.0.0.0:8080"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      LIBRARY_SCAN_YIELD_EVERY: ${LIBRARY_SCAN_YIELD_EVERY:-150}
      LIBRARY_SCAN_YIELD_MS: ${LIBRARY_SCAN_YIELD_MS:-3}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
    cpus: '2'
    mem_limit: 2g
    volumes:
      # Writable mount required if you use imprint (writing tags); remove :ro in an override compose file.
      - ${MUSIC_HOST_DIR}:/music:ro
      - musicsh_data:/data

volumes:
  pgdata:
  musicsh_data:
