services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicsh
      POSTGRES_PASSWORD: musicsh
      POSTGRES_DB: musicsh
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicsh -d musicsh"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Память: при превышении — OOM-килл контейнера, затем перезапуск (unless-stopped).
    # CPU: только ограничение доли процессора (throttling), без убийства процесса.
    # Подберите значения под хост (см. free -h, nproc); для слабого VPS можно 512m и "1.0".
    cpus: "2.0"
    mem_limit: 2g
    ports:
      - "8180:8080"
    environment:
      DATABASE_URL: postgres://musicsh:musicsh@db:5432/musicsh?sslmode=disable
      JWT_SECRET: change-me-in-production-please-32ch
      MUSIC_DIR: /music
      DATA_DIR: /data
      SCAN_ON_START: "0"
      # For "Shazam-like" background identification (Chromaprint+AcoustID).
      # Get a free key: https://acoustid.org/
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      # Optional: set explicit allowed origins (comma-separated) instead of "*"
      # CORS_ORIGIN: "https://your-domain.example"
    volumes:
      - type: bind
        source: /share/music
       #source: ./music 
        target: /music
        read_only: true
      - ./appdata:/data
    depends_on:
      db:
        condition: service_healthy
