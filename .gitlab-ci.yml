stages:
  - build
  - deploy
  - test

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

.build_image_rules: &build_image_rules
  rules:
    - if: $CI_COMMIT_BRANCH

.deploy_alpine:
  stage: deploy
  image: alpine:3.20
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client rsync bash

build:image:
  stage: build
  image: docker:27
  tags:
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  <<: *build_image_rules
  before_script:
    - unset DOCKER_TLS_VERIFY || true
    - unset DOCKER_CERT_PATH || true
  script:
    - docker version
    - docker build --pull -t "$CI_PROJECT_NAME:$CI_COMMIT_SHA" .

# Home / self-hosted dev server (was mislabeled production).
deploy:dev:
  extends: .deploy_alpine
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - export GITLAB_CI_SSH_KEY_B64="${DEV_DEPLOY_SSH_PRIVATE_KEY_B64:-}"
    - export GITLAB_CI_SSH_KEY="${DEV_DEPLOY_SSH_PRIVATE_KEY:-}"
    - export GITLAB_CI_DEPLOY_HOST="${DEV_DEPLOY_HOST:?Set CI/CD variable DEV_DEPLOY_HOST}"
    - export GITLAB_CI_DEPLOY_USER="${DEV_DEPLOY_USER:?Set CI/CD variable DEV_DEPLOY_USER}"
    - export GITLAB_CI_DEPLOY_DIR="${DEV_DEPLOY_DIR:?Set CI/CD variable DEV_DEPLOY_DIR}"
    - export GITLAB_CI_WRITE_ENV_FROM_CI="${DEV_DEPLOY_WRITE_ENV_FROM_CI:-}"
    - export GITLAB_CI_MUSIC_HOST_DIR="${DEV_MUSIC_HOST_DIR:-}"
    - bash scripts/gitlab_rsync_deploy.sh

# Remote demo / quasi-prod - only from Play in GitLab UI (manual).
deploy:demo:
  extends: .deploy_alpine
  environment:
    name: demo
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - export GITLAB_CI_SSH_KEY_B64="${DEMO_DEPLOY_SSH_PRIVATE_KEY_B64:-}"
    - export GITLAB_CI_SSH_KEY="${DEMO_DEPLOY_SSH_PRIVATE_KEY:-}"
    - export GITLAB_CI_DEPLOY_HOST="${DEMO_DEPLOY_HOST:?Set CI/CD variable DEMO_DEPLOY_HOST}"
    - export GITLAB_CI_DEPLOY_USER="${DEMO_DEPLOY_USER:?Set CI/CD variable DEMO_DEPLOY_USER}"
    - export GITLAB_CI_DEPLOY_DIR="${DEMO_DEPLOY_DIR:?Set CI/CD variable DEMO_DEPLOY_DIR}"
    - export GITLAB_CI_WRITE_ENV_FROM_CI="${DEMO_DEPLOY_WRITE_ENV_FROM_CI:-}"
    - export GITLAB_CI_MUSIC_HOST_DIR="${DEMO_MUSIC_HOST_DIR:-}"
    - bash scripts/gitlab_rsync_deploy.sh

# Version tag on GitLab -> tag + release on github.com/lexshabalin/music.sh.
# Needs CI/CD variable GITHUB_TOKEN (fine-grained PAT, Contents: Read and write). Mask it.
# Leave it unprotected, or also protect v* tags — protected variables are hidden on unprotected tags.
release:github:
  stage: deploy
  image: alpine:3.20
  tags:
    - docker
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache bash git curl
    - bash scripts/github_release.sh

.test_web_template: &test_web_template
  stage: test
  image: node:20-bookworm-slim
  tags:
    - docker
  variables:
    CI: "true"
  script:
    # One shell session: after `cd web` the cwd stays in web/ (do not repeat `cd web`).
    - |
      set -e
      cd web
      npm ci
      npx playwright install --with-deps chromium
      npm run test:ci

# Branches and MRs: run unit tests after build (no deploy on this path).
test:web:
  <<: *test_web_template
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  needs:
    - job: build:image

# Default branch push: run tests only after home dev deploy succeeds.
test:web:post_dev_deploy:
  <<: *test_web_template
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build:image
    - job: deploy:dev
