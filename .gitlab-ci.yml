stages:
  - build
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:image:
  stage: build
  image: docker:27
  tags:
    - mediasrv
    - docker
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - unset DOCKER_TLS_VERIFY || true
    - unset DOCKER_CERT_PATH || true
  script:
    - docker version
    - docker build --pull -t "$CI_PROJECT_NAME:$CI_COMMIT_SHA" .

deploy:prod:
  stage: deploy
  image: alpine:3.20
  tags:
    - mediasrv
    - docker
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    # Prefer base64 form (single-line, can be masked): DEPLOY_SSH_PRIVATE_KEY_B64
    # Fallback: DEPLOY_SSH_PRIVATE_KEY (either base64 or raw multiline)
    - |
      key_src=""
      if [ -n "${DEPLOY_SSH_PRIVATE_KEY_B64:-}" ]; then
        key_src="$DEPLOY_SSH_PRIVATE_KEY_B64"
      else
        key_src="${DEPLOY_SSH_PRIVATE_KEY:-}"
      fi

      if [ -z "$key_src" ]; then
        echo "Missing DEPLOY_SSH_PRIVATE_KEY_B64 (preferred) or DEPLOY_SSH_PRIVATE_KEY" >&2
        exit 1
      fi

      # If value is base64, decode; otherwise treat as raw private key.
      if echo "$key_src" | base64 -d >/tmp/deploy_key 2>/dev/null; then
        tr -d '\r' </tmp/deploy_key | ssh-add -
      else
        echo "$key_src" | tr -d '\r' | ssh-add -
      fi
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # Sync repo to server (do not upload git metadata)
    # Important: do not touch runtime volumes created by Docker (pgdata/appdata),
    # otherwise rsync --delete may fail on permissions and/or destroy data.
    - rsync -az --delete
      --exclude '.git'
      --exclude '.gitlab-ci.yml'
      --exclude '.env'
      --exclude 'pgdata/'
      --exclude 'appdata/'
      --exclude 'music/'
      ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
    # Run deploy on server
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash '$DEPLOY_DIR/scripts/deploy_remote.sh'"
